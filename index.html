<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ATOM · UNIVERSAL ENGINE</title>

<style>
body {
    margin:0;
    background:#000;
    overflow:hidden;
}
canvas {
    display:block;
}
</style>
</head>

<body>

<canvas id="atomCanvas"></canvas>

<script>
// Canvas Setup
const canvas = document.getElementById("atomCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ATOM Effekte aus allen Ordnern
const effects = {
    elektron: { color:"#4AF0FF", speed:2.2, radius:140 },
    neutron:  { color:"#C8C8C8", speed:1.4, radius:90 },
    plutron:  { color:"#FF4A4A", speed:0.9, radius:50 },
    upx:      { shiftX: 0.42 },
    upy:      { shiftY: 0.77 },
    upz:      { spin:   0.13 },
    move:     { energy: 67.5 },
    ufo:      { pulse: Math.pow(9,9) }
};

// Orbit-Knoten aus deiner Formel
const nodes = [
    { label:"◉", radius:0 },
    { label:"3", radius:60 },
    { label:"9", radius:120 },
    { label:"◎", radius:180 },
    { label:"◆", radius:240 },
    { label:"▣", radius:300 },
    { label:"△", radius:360 },
    { label:"27", radius:420 },
    { label:"81", radius:480 },
    { label:"756", radius:540 }
];

let t = 0;

// Render Loop
function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);

    // UFO Puls
    const pulse = Math.sin(t/20) * 20;

    // Orbit Rendering
    nodes.forEach((n,i)=>{
        const angle = t/50 + i;
        const x = Math.cos(angle) * (n.radius + pulse);
        const y = Math.sin(angle) * (n.radius + pulse);

        ctx.fillStyle = "#0f0";
        ctx.font = "24px Consolas";
        ctx.fillText(n.label, x, y);
    });

    // Elektron Orbit
    drawOrbit(effects.elektron);

    // Neutron Orbit
    drawOrbit(effects.neutron);

    // Plutron Orbit
    drawOrbit(effects.plutron);

    ctx.restore();

    t++;
    requestAnimationFrame(draw);
}

function drawOrbit(layer) {
    const angle = t / (20 / layer.speed);
    const x = Math.cos(angle) * layer.radius;
    const y = Math.sin(angle) * layer.radius;

    ctx.fillStyle = layer.color;
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI*2);
    ctx.fill();
}

draw();
</script>

</body>
</html>

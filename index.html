<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ATOM · FORMEL SZENE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>ATOM · FORMEL SZENE</h1>

<div id="atom-scene">

    <!-- Zentrum -->
    <div class="node core">◉</div>

    <!-- Erste Ebene -->
    <div class="node e3">3</div>
    <div class="node e9">9</div>

    <!-- Zweite Ebene -->
    <div class="node ufo">◎</div>

    <!-- Dritte Ebene -->
    <div class="node plutron">◆</div>
    <div class="node neutron">▣</div>
    <div class="node elektron">△</div>

    <!-- Energie-Sequenz -->
    <div class="node seq3">3</div>
    <div class="node seq9">9</div>
    <div class="node seq27">27</div>
    <div class="node seq81">81</div>
    <div class="node seq756">756</div>

</div>

<script src="atom.js"></script>
<script src="respo.js"></script>
<script src="anker.js"></script>

</body>
</html>

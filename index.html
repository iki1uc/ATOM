<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ATOM – Szene</title>
    <link rel="stylesheet" href="style.css">
    <script src="anker.js"></script>
    <script src="atom.js"></script>
    <script src="respo.js"></script>

    <!-- ID-System -->
    <script src="IDkoop.js"></script>
    <script src="IDneutral.js"></script>
    <script src="IDpook.js"></script>
</head>

<body>

<div id="scene">

    <!-- ATOM Zentrum -->
    <div id="atom-core">
        ATOM
    </div>

    <!-- Drei Ebenen -->
    <div class="layer" id="layer-elektron"></div>
    <div class="layer" id="layer-neutron"></div>
    <div class="layer" id="layer-plutron"></div>

    <!-- ID Anzeige -->
    <div id="id-info"></div>

</div>

<script>

    /* Farb-Engine */
    function atomColor(type, mode, nuanceValue = 0) {
        const colors = {
            ELEKTRON: { active: "#4AF0FF", passive: "#1C6E75" },
            NEUTRON:  { active: "#C8C8C8", passive: "#6E6E6E" },
            PLUTRON:  { active: "#FF4A4A", passive: "#7A1C1C" }
        };

        let base = colors[type][mode];
        let nuance = Math.floor(nuanceValue % 255).toString(16).padStart(2, "0");
        return base + nuance;
    }

    /* Mathematischer Weiterwurf */
    function weiterwurf(axisValue) {
        return Math.sin(axisValue * Math.PI) * 255;
    }

    /* UP-Achsen simuliert */
    const UPX = { value: 0.42 };
    const UPY = { value: 0.77 };
    const UPZ = { value: 0.13 };

    /* Ebenen aktualisieren */
    function updateLayers() {
        document.getElementById("layer-elektron").style.backgroundColor =
            atomColor("ELEKTRON", "active", weiterwurf(UPX.value));

        document.getElementById("layer-neutron").style.backgroundColor =
            atomColor("NEUTRON", "active", weiterwurf(UPY.value));

        document.getElementById("layer-plutron").style.backgroundColor =
            atomColor("PLUTRON", "active", weiterwurf(UPZ.value));
    }

    updateLayers();

    /* ID-System */
    function showID(mode) {
        const map = {
            koop: ID_KOOP,
            neutral: ID_NEUTRAL,
            pook: ID_POOK
        };
        const id = map[mode];
        document.getElementById("id-info").innerText = id.info();
    }

    showID("neutral");

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ID · PLUTRON</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas;
    padding:40px;
}

/* Geometrisches Achsen-Symbol */
#plutron {
    width:200px;
    height:200px;
    margin:auto;
    position:relative;
    border:3px solid #0f0;
    border-radius:50%;
}

/* Achsenlinien */
.axis {
    position:absolute;
    background:#0f0;
    opacity:0.4;
}

/* Vertikal */
#v {
    width:3px;
    height:200px;
    left:50%;
    top:0;
    transform:translateX(-50%);
}

/* Horizontal */
#h {
    width:200px;
    height:3px;
    top:50%;
    left:0;
    transform:translateY(-50%);
}

/* Diagonal IN/OUT */
#d1 {
    width:3px;
    height:200px;
    left:50%;
    top:0;
    transform:translateX(-50%) rotate(45deg);
}

#d2 {
    width:3px;
    height:200px;
    left:50%;
    top:0;
    transform:translateX(-50%) rotate(-45deg);
}

/* PLUTRON-Kern (+) */
#core {
    position:absolute;
    width:40px;
    height:40px;
    background:#111;
    border:3px solid #0ff;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0ff;
    font-size:20px;
}
</style>
</head>

<body>

<h1>ID · PLUTRON</h1>

<div id="plutron">
    <div id="v" class="axis"></div>
    <div id="h" class="axis"></div>
    <div id="d1" class="axis"></div>
    <div id="d2" class="axis"></div>
    <div id="core">+</div>
</div>

<pre>
ID = AXIS(P)⊕

Achsen: N, S, E, W, UP, DOWN, IN, OUT
Kern: + = KOOP · POOK · 0000
Universell: VLOU (81 × 3)
</pre>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ID · NEUTRON</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas;
    padding:40px;
}

/* Geometrisches Achsen-Symbol */
#neutron {
    width:200px;
    height:200px;
    margin:auto;
    position:relative;
    border:3px solid #aaa;
    border-radius:50%;
}

/* Achsenlinien */
.axis {
    position:absolute;
    background:#aaa;
    opacity:0.35;
}

/* Vertikal */
#v {
    width:3px;
    height:200px;
    left:50%;
    top:0;
    transform:translateX(-50%);
}

/* Horizontal */
#h {
    width:200px;
    height:3px;
    top:50%;
    left:0;
    transform:translateY(-50%);
}

/* Diagonal IN/OUT */
#d1 {
    width:3px;
    height:200px;
    left:50%;
    top:0;
    transform:translateX(-50%) rotate(45deg);
}

#d2 {
    width:3px;
    height:200px;
    left:50%;
    top:0;
    transform:translateX(-50%) rotate(-45deg);
}

/* NEUTRON-Kern (0000) */
#core {
    position:absolute;
    width:40px;
    height:40px;
    background:#111;
    border:3px solid #aaa;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:16px;
}
</style>
</head>

<body>

<h1>ID · NEUTRON</h1>

<div id="neutron">
    <div id="v" class="axis"></div>
    <div id="h" class="axis"></div>
    <div id="d1" class="axis"></div>
    <div id="d2" class="axis"></div>
    <div id="core">0000</div>
</div>

<pre>
ID = AXIS(NT)○

Achsen: N, S, E, W, UP, DOWN, IN, OUT
Kern: 0000 = KOOP · POOK · 0000
Universell: VLOU (81 × 3)
</pre>

</body>
</html>

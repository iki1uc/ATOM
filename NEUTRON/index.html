<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NEUTRON · 0000 ENERGIE</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas;
    padding:40px;
    text-align:center;
}

/* Szene */
#scene {
    width:340px;
    height:340px;
    margin:auto;
    position:relative;
    border:3px solid #777;
    border-radius:50%;
    box-shadow:0 0 25px #333 inset;
}

/* Achsenlinien */
.axis {
    position:absolute;
    background:#777;
    opacity:0.25;
    transition:opacity 0.4s;
}

/* Vertikal */
#v {
    width:3px;
    height:340px;
    left:50%;
    top:0;
    transform:translateX(-50%);
}

/* Horizontal */
#h {
    width:340px;
    height:3px;
    top:50%;
    left:0;
    transform:translateY(-50%);
}

/* Diagonal IN/OUT */
#d1 {
    width:3px;
    height:340px;
    left:50%;
    top:0;
    transform:translateX(-50%) rotate(45deg);
}

#d2 {
    width:3px;
    height:340px;
    left:50%;
    top:0;
    transform:translateX(-50%) rotate(-45deg);
}

/* NEUTRON-Kern (0000) */
#core {
    position:absolute;
    width:70px;
    height:70px;
    background:#111;
    border:3px solid #999;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ccc;
    font-size:18px;
    animation:pulse 4s infinite;
}

/* Pulsation – ultra neutral */
@keyframes pulse {
    0%   { transform:translate(-50%, -50%) scale(1);   border-color:#777; color:#aaa; }
    50%  { transform:translate(-50%, -50%) scale(1.25); border-color:#fff; color:#fff; }
    100% { transform:translate(-50%, -50%) scale(1);   border-color:#777; color:#aaa; }
}

/* Energie-Rotation – sehr ruhig */
#energy {
    position:absolute;
    width:300px;
    height:300px;
    border:2px dashed #777;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    animation:rotate540 12s linear infinite;
}

@keyframes rotate540 {
    from { transform:translate(-50%, -50%) rotate(0deg); }
    to   { transform:translate(-50%, -50%) rotate(540deg); }
}
